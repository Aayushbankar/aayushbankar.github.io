<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Multi-Threaded TCP Port Scanner">
<title>Port Scanner</title>
<defs>
  <linearGradient id="ps-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="ps-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#c8a24b" stop-opacity="0.14"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="ps-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#1c1a14" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #ffd37a; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ps-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ps-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ps-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#c8a24b" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#241e10" stroke="#7a5d12"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#c8a24b" text-anchor="middle">09</text>
  <circle cx="72" cy="29" r="3.5" fill="#c8a24b">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">LAYER-4 CONCURRENCY &#183; SOCKETS</text>

  <text x="24" y="72" font-size="22" font-weight="800" letter-spacing="1.2" fill="#ede8dc">TCP PORT SCANNER</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#c8a24b">MULTI-THREADED L4 TRANSPORT RECON</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">High-concurrency TCP handshake probe engine.</text>
  <text class="d" x="24" y="141">Worker thread pool management with OS boundary tuning.</text>
  <text class="d" x="24" y="158">Deterministic port classification without raw packets.</text>
  <text class="d" x="24" y="175">Microsecond socket timeout calibration on Linux.</text>

  <g>
    <rect x="24" y="196" width="70" height="17" rx="3.5" fill="#241e10" stroke="#7a5d12"/><text class="chip" x="59" y="208" text-anchor="middle">PYTHON</text>
    <rect x="100" y="196" width="76" height="17" rx="3.5" fill="#241e10" stroke="#7a5d12"/><text class="chip" x="138" y="208" text-anchor="middle">SOCKETS</text>
    <rect x="182" y="196" width="84" height="17" rx="3.5" fill="#241e10" stroke="#7a5d12"/><text class="chip" x="224" y="208" text-anchor="middle">THREADPOOL</text>
    <rect x="272" y="196" width="56" height="17" rx="3.5" fill="#241e10" stroke="#7a5d12"/><text class="chip" x="300" y="208" text-anchor="middle">L4 TCP</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">github.com/Aayushbankar/port_scanner_mt</text>
</g>

<!-- TCP 3-Way Handshake Socket Matrix -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#101010" stroke="#2a2a26"/>
  <!-- Worker Pool -->
  <rect x="-44" y="-46" width="88" height="16" rx="3" fill="#241e10" stroke="#c8a24b" stroke-width="1.2"/>
  <text x="0" y="-34" font-size="7.5" fill="#c8a24b" font-weight="700" text-anchor="middle">Thread Pool</text>
  <!-- Socket Connect -->
  <rect x="-44" y="-12" width="88" height="22" rx="4" fill="#181610" stroke="#7a5d12" stroke-width="1.2"/>
  <text x="0" y="2" font-size="8" fill="#ede8dc" font-weight="700" text-anchor="middle">TCP Handshake</text>
  <!-- Port State -->
  <rect x="-44" y="28" width="88" height="16" rx="3" fill="#101010" stroke="#c8a24b" stroke-width="1.2"/>
  <text x="0" y="39" font-size="7.5" fill="#ffd37a" font-weight="700" text-anchor="middle">Open / Closed</text>
  <!-- Connectors -->
  <line x1="0" y1="-30" x2="0" y2="-12" stroke="#c8a24b" stroke-width="1.2"/>
  <line x1="0" y1="10" x2="0" y2="28" stroke="#7a5d12" stroke-width="1.2"/>
</g>
</svg>
