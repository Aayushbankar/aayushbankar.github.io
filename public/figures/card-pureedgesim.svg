<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="PureEdgeSim CLI Integration">
<title>PureEdgeSim CLI</title>
<defs>
  <linearGradient id="pe-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="pe-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#9da65d" stop-opacity="0.14"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="pe-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#1c1a14" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #b8c773; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pe-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pe-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pe-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#9da65d" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#1b2414" stroke="#485c25"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#9da65d" text-anchor="middle">10</text>
  <circle cx="72" cy="29" r="3.5" fill="#9da65d">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">EDGE COMPUTING &#183; SIMULATION CLI</text>

  <text x="24" y="72" font-size="22" font-weight="800" letter-spacing="1.2" fill="#ede8dc">PUREEDGESIM CLI</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#9da65d">CLOUD / EDGE / MIST SIMULATION ENGINE</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">Open-source contribution to PureEdgeSim simulator.</text>
  <text class="d" x="24" y="141">Interactive CLI mode for headless scenario runs.</text>
  <text class="d" x="24" y="158">Enables batch execution on remote compute clusters.</text>
  <text class="d" x="24" y="175">Java / Maven architecture with streamlined menus.</text>

  <g>
    <rect x="24" y="196" width="60" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="54" y="208" text-anchor="middle">JAVA</text>
    <rect x="90" y="196" width="68" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="124" y="208" text-anchor="middle">MAVEN</text>
    <rect x="164" y="196" width="84" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="206" y="208" text-anchor="middle">CLOUDSIM</text>
    <rect x="254" y="196" width="68" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="288" y="208" text-anchor="middle">EDGE CLI</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">github.com/Aayushbankar/PureEdgeSim</text>
</g>

<!-- Simulation Grid Diagram -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#101010" stroke="#2a2a26"/>
  <!-- Headless CLI -->
  <rect x="-44" y="-46" width="88" height="16" rx="3" fill="#1b2414" stroke="#9da65d" stroke-width="1.2"/>
  <text x="0" y="-34" font-size="7.5" fill="#9da65d" font-weight="700" text-anchor="middle">CLI Controller</text>
  <!-- Sim Core -->
  <rect x="-44" y="-12" width="88" height="22" rx="4" fill="#141812" stroke="#485c25" stroke-width="1.2"/>
  <text x="0" y="2" font-size="8" fill="#ede8dc" font-weight="700" text-anchor="middle">Simulation Core</text>
  <!-- Edge Nodes -->
  <rect x="-44" y="28" width="88" height="16" rx="3" fill="#101010" stroke="#9da65d" stroke-width="1.2"/>
  <text x="0" y="39" font-size="7.5" fill="#b8c773" font-weight="700" text-anchor="middle">Edge / Mist Nodes</text>
  <!-- Connectors -->
  <line x1="0" y1="-30" x2="0" y2="-12" stroke="#9da65d" stroke-width="1.2"/>
  <line x1="0" y1="10" x2="0" y2="28" stroke="#485c25" stroke-width="1.2"/>
</g>
</svg>
