<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="IT Grads Snap-Scroll Job Feed">
<title>IT Grads Mobile Job Feed</title>
<defs>
  <linearGradient id="ig-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="ig-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="ig-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#12201a" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #6ee7b7; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ig-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ig-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ig-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#10b981" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#0b241b" stroke="#065f46"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">11</text>
  <circle cx="72" cy="29" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">PRODUCTION WEB &#183; ZERO FRAMEWORK</text>

  <text x="24" y="72" font-size="22" font-weight="800" letter-spacing="1.2" fill="#ede8dc">IT GRADS JOB FEED</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#10b981">PURE PHP 8.2 &#183; O(1) B-TREE PAGINATION</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">High-performance vertical snap-scroll mobile job portal.</text>
  <text class="d" x="24" y="141">Built with Pure PHP 8.2 &amp; MySQL PDO without bulky JS frameworks.</text>
  <text class="d" x="24" y="158">O(1) constant-time indexed cursor pagination across large sets.</text>
  <text class="d" x="24" y="175">Single blob parser + GD auto-compression + 100dvh viewport fit.</text>

  <g>
    <rect x="24" y="196" width="68" height="17" rx="3.5" fill="#0b241b" stroke="#065f46"/><text class="chip" x="58" y="208" text-anchor="middle">PHP 8.2</text>
    <rect x="98" y="196" width="60" height="17" rx="3.5" fill="#0b241b" stroke="#065f46"/><text class="chip" x="128" y="208" text-anchor="middle">MYSQL</text>
    <rect x="164" y="196" width="76" height="17" rx="3.5" fill="#0b241b" stroke="#065f46"/><text class="chip" x="202" y="208" text-anchor="middle">100DVH</text>
    <rect x="246" y="196" width="76" height="17" rx="3.5" fill="#0b241b" stroke="#065f46"/><text class="chip" x="284" y="208" text-anchor="middle">PHP-GD</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">github.com/Aayushbankar/itgrads_web</text>
</g>

<!-- Mobile phone snap-scroll schematic -->
<g transform="translate(466,126)" class="m">
  <rect x="-30" y="-52" width="60" height="104" rx="10" fill="#06120d" stroke="#059669" stroke-width="1.5"/>
  <rect x="-24" y="-44" width="48" height="26" rx="4" fill="#0f2b20" stroke="#10b981" stroke-width="1"/>
  <rect x="-24" y="-12" width="48" height="26" rx="4" fill="#0f2b20" stroke="#10b981" stroke-width="1"/>
  <rect x="-24" y="20" width="48" height="24" rx="4" fill="#0f2b20" opacity="0.6"/>
  <!-- Home indicator -->
  <line x1="-12" y1="48" x2="12" y2="48" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
</g>
</svg>
