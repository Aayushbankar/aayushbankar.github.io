<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Polymathic 3D WebGL Ecosystem">
<title>Polymathic 3D WebGL</title>
<defs>
  <linearGradient id="pm-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="pm-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="pm-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#161b22" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #7dd3fc; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pm-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pm-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pm-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#38bdf8" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#0c1d2c" stroke="#1e4e79"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">08</text>
  <circle cx="72" cy="29" r="3.5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">CREATIVE TECH &#183; 3D GRAPHICS &amp; SHADERS</text>

  <text x="24" y="72" font-size="22" font-weight="800" letter-spacing="1.2" fill="#ede8dc">POLYMATHIC 3D LAB</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#38bdf8">WEBGL &#183; THREE.JS &#183; GSAP SCROLLTRIGGER</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">Interactive 3D web environments with custom WebGL shaders.</text>
  <text class="d" x="24" y="141">Bayer matrix dither &amp; ASCII post-processing fragment shaders.</text>
  <text class="d" x="24" y="158">60 FPS GSAP ScrollTrigger timelines and mesh morphing.</text>
  <text class="d" x="24" y="175">Dual-mode rendering with zero layout shift architecture.</text>

  <g>
    <rect x="24" y="196" width="70" height="17" rx="3.5" fill="#0c1d2c" stroke="#1e4e79"/><text class="chip" x="59" y="208" text-anchor="middle">THREE.JS</text>
    <rect x="100" y="196" width="60" height="17" rx="3.5" fill="#0c1d2c" stroke="#1e4e79"/><text class="chip" x="130" y="208" text-anchor="middle">WEBGL</text>
    <rect x="166" y="196" width="68" height="17" rx="3.5" fill="#0c1d2c" stroke="#1e4e79"/><text class="chip" x="200" y="208" text-anchor="middle">GSAP 3</text>
    <rect x="240" y="196" width="80" height="17" rx="3.5" fill="#0c1d2c" stroke="#1e4e79"/><text class="chip" x="280" y="208" text-anchor="middle">SHADERS</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">github.com/Aayushbankar</text>
</g>

<!-- 3D Polyhedron wireframe diagram -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#0c1219" stroke="#1e293b"/>
  <!-- Icosahedron wireframe lines -->
  <polygon points="0,-45 42,-14 26,38 -26,38 -42,-14" stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.8"/>
  <polygon points="0,-22 22,-7 14,20 -14,20 -22,-7" stroke="#7dd3fc" stroke-width="1" fill="none" opacity="0.6"/>
  <line x1="0" y1="-45" x2="0" y2="-22" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <line x1="42" y1="-14" x2="22" y2="-7" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <line x1="26" y1="38" x2="14" y2="20" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <line x1="-26" y1="38" x2="-14" y2="20" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <line x1="-42" y1="-14" x2="-22" y2="-7" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
</g>
</svg>
