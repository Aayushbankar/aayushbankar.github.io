<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="YT_STLK YouTube Activity Engine">
<title>YT_STLK Activity Engine</title>
<defs>
  <linearGradient id="yt-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="yt-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="yt-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#221214" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #fca5a5; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#yt-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#yt-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#yt-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#ef4444" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#2b1113" stroke="#7f1d1d"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle">10</text>
  <circle cx="72" cy="29" r="3.5" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">MEDIA INTELLIGENCE &#183; RENDER DEPLOYED</text>

  <text x="24" y="72" font-size="22" font-weight="800" letter-spacing="1.2" fill="#ede8dc">YT_STLK ENGINE</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#ef4444">PLAYLIST SURVEILLANCE &#183; DELTA TRACKER</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">Automated creator channel playlist and video delta tracker.</text>
  <text class="d" x="24" y="141">Detects unlisted uploads and stealth playlist reorganization.</text>
  <text class="d" x="24" y="158">Production deployed on Render with zero quota-exhaustion logic.</text>
  <text class="d" x="24" y="175">Background scheduler with SQLite diffing &amp; webhook alerts.</text>

  <g>
    <rect x="24" y="196" width="68" height="17" rx="3.5" fill="#2b1113" stroke="#7f1d1d"/><text class="chip" x="58" y="208" text-anchor="middle">PYTHON</text>
    <rect x="98" y="196" width="60" height="17" rx="3.5" fill="#2b1113" stroke="#7f1d1d"/><text class="chip" x="128" y="208" text-anchor="middle">FLASK</text>
    <rect x="164" y="196" width="68" height="17" rx="3.5" fill="#2b1113" stroke="#7f1d1d"/><text class="chip" x="198" y="208" text-anchor="middle">RENDER</text>
    <rect x="238" y="196" width="76" height="17" rx="3.5" fill="#2b1113" stroke="#7f1d1d"/><text class="chip" x="276" y="208" text-anchor="middle">YOUTUBE</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">stkher.onrender.com</text>
</g>

<!-- Surveillance radar / delta graphic -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#150a0b" stroke="#450a0a"/>
  <!-- Target rings -->
  <circle r="44" fill="none" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="3,3"/>
  <circle r="24" fill="none" stroke="#b91c1c" stroke-width="1.2"/>
  <!-- Sweep line -->
  <line x1="0" y1="0" x2="38" y2="-24" stroke="#ef4444" stroke-width="1.8"/>
  <circle cx="38" cy="-24" r="3.5" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="3" fill="#fca5a5"/>
</g>
</svg>
