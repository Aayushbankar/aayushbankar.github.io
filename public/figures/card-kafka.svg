<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Franz Kafka Story Generator">
<title>Kafka Story Generator</title>
<defs>
  <linearGradient id="kf-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="kf-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="kf-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#1c1626" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #c084fc; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#kf-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#kf-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#kf-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#a855f7" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#20132c" stroke="#581c87"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#a855f7" text-anchor="middle">09</text>
  <circle cx="72" cy="29" r="3.5" fill="#a855f7">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">NATURAL LANGUAGE &#183; HUGGING FACE</text>

  <text x="24" y="72" font-size="22" font-weight="800" letter-spacing="1.2" fill="#ede8dc">KAFKA STORY GENERATOR</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#a855f7">FINE-TUNED GPT-2 &#183; LITERARY TEXT SYNTHESIS</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">Specialized autoregressive LM trained on Kafka literary corpus.</text>
  <text class="d" x="24" y="141">Published model weights hosted on Hugging Face Hub.</text>
  <text class="d" x="24" y="158">Temperature, top-p nucleus sampling &amp; repetition penalty.</text>
  <text class="d" x="24" y="175">Interactive generation interface with sub-second token output.</text>

  <g>
    <rect x="24" y="196" width="60" height="17" rx="3.5" fill="#20132c" stroke="#581c87"/><text class="chip" x="54" y="208" text-anchor="middle">GPT-2</text>
    <rect x="90" y="196" width="76" height="17" rx="3.5" fill="#20132c" stroke="#581c87"/><text class="chip" x="128" y="208" text-anchor="middle">PYTORCH</text>
    <rect x="172" y="196" width="96" height="17" rx="3.5" fill="#20132c" stroke="#581c87"/><text class="chip" x="220" y="208" text-anchor="middle">HUGGINGFACE</text>
    <rect x="274" y="196" width="60" height="17" rx="3.5" fill="#20132c" stroke="#581c87"/><text class="chip" x="304" y="208" text-anchor="middle">FLASK</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">huggingface.co/bankar404</text>
</g>

<!-- Neural Token Generation Graphic -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#130e1c" stroke="#3b0764"/>
  <!-- Attention network nodes -->
  <circle cx="-30" cy="-25" r="7" fill="#2e1065" stroke="#a855f7" stroke-width="1.2"/>
  <circle cx="30" cy="-25" r="7" fill="#2e1065" stroke="#a855f7" stroke-width="1.2"/>
  <circle cx="0" cy="0" r="9" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="-25" cy="28" r="7" fill="#2e1065" stroke="#a855f7" stroke-width="1.2"/>
  <circle cx="25" cy="28" r="7" fill="#2e1065" stroke="#a855f7" stroke-width="1.2"/>
  <line x1="-30" y1="-25" x2="0" y2="0" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="-25" x2="0" y2="0" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <line x1="-25" y1="28" x2="0" y2="0" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <line x1="25" y1="28" x2="0" y2="0" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <text x="0" y="3" font-size="8" fill="#f5d0fe" font-weight="700" text-anchor="middle">LM</text>
</g>
</svg>
