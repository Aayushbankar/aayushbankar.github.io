<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="QuantLab Discrete Event Backtesting Engine">
<title>QuantLab</title>
<defs>
  <linearGradient id="ql-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="ql-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#c8a24b" stop-opacity="0.18"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="ql-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#1c1a14" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #e5c158; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ql-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ql-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ql-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#c8a24b" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#241e10" stroke="#7a6212"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#c8a24b" text-anchor="middle">03</text>
  <circle cx="72" cy="29" r="3.5" fill="#c8a24b">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">QUANTITATIVE FINANCE &#183; MARKET SIMULATION</text>

  <text x="24" y="72" font-size="24" font-weight="800" letter-spacing="1.4" fill="#ede8dc">QUANTLAB</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#c8a24b">DISCRETE-EVENT BACKTESTER &#183; FRICTION MODEL</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">Discrete event order execution with state transitions.</text>
  <text class="d" x="24" y="141">Almgren-Chriss nonlinear market impact simulation.</text>
  <text class="d" x="24" y="158">SEBI statutory friction: STT, stamp duty, exchange fees.</text>
  <text class="d" x="24" y="175">Deflated Sharpe Ratio (DSR 0.73) overfit protection.</text>

  <g>
    <rect x="24" y="196" width="68" height="17" rx="3.5" fill="#241e10" stroke="#7a6212"/><text class="chip" x="58" y="208" text-anchor="middle">PYTHON</text>
    <rect x="98" y="196" width="68" height="17" rx="3.5" fill="#241e10" stroke="#7a6212"/><text class="chip" x="132" y="208" text-anchor="middle">PANDAS</text>
    <rect x="172" y="196" width="76" height="17" rx="3.5" fill="#241e10" stroke="#7a6212"/><text class="chip" x="210" y="208" text-anchor="middle">STREAMLIT</text>
    <rect x="254" y="196" width="76" height="17" rx="3.5" fill="#241e10" stroke="#7a6212"/><text class="chip" x="292" y="208" text-anchor="middle">ALMGREN</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">github.com/Aayushbankar/Quantlab</text>
</g>

<!-- Technical Chart & Simulation Graphic -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#101010" stroke="#2a2a26"/>
  <!-- Equity Curve Graph Path -->
  <path d="M-50 35 Q-30 20 -15 10 T10 -15 T35 -30 T50 -42" stroke="#c8a24b" stroke-width="2.2" fill="none"/>
  <!-- Friction Baseline -->
  <path d="M-50 35 Q-30 28 -15 22 T10 8 T35 -5 T50 -12" stroke="#6b675f" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>
  <!-- Stat boxes -->
  <rect x="-42" y="-12" width="84" height="20" rx="3" fill="#1c1a14" stroke="#c8a24b" stroke-width="1"/>
  <text x="0" y="2" font-size="8" fill="#e5c158" font-weight="700" text-anchor="middle">DSR: 0.73 &#183; OOS</text>
</g>
</svg>
