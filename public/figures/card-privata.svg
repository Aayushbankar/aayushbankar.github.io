<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Privata Air-Gapped RAG Engine">
<title>Privata</title>
<defs>
  <linearGradient id="pv-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c0b"/><stop offset="1" stop-color="#141412"/>
  </linearGradient>
  <radialGradient id="pv-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#9da65d" stop-opacity="0.16"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="pv-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#1c1a14" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #a8a29a; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #b8c773; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pv-bg)" stroke="#2a2a26"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pv-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#pv-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#9da65d" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#1b2414" stroke="#485c25"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#9da65d" text-anchor="middle">05</text>
  <circle cx="72" cy="29" r="3.5" fill="#9da65d">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#ede8dc">AIR-GAPPED RAG &#183; VECTOR STORE</text>

  <text x="24" y="72" font-size="24" font-weight="800" letter-spacing="1.2" fill="#ede8dc">PRIVATA</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#9da65d">OFFLINE DOCUMENT INGESTION &amp; QUERY</text>
  <path d="M24 104 H352" stroke="#2a2a26"/>

  <text class="d" x="24" y="124">Local-first document semantic search and retrieval.</text>
  <text class="d" x="24" y="141">Sentence Transformers + persistent ChromaDB vector store.</text>
  <text class="d" x="24" y="158">Zero-cloud ingestion: sensitive reports never leave RAM.</text>
  <text class="d" x="24" y="175">High-speed CLI query interface with sliding window tokens.</text>

  <g>
    <rect x="24" y="196" width="70" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="59" y="208" text-anchor="middle">PYTHON</text>
    <rect x="100" y="196" width="78" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="139" y="208" text-anchor="middle">CHROMADB</text>
    <rect x="184" y="196" width="94" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="231" y="208" text-anchor="middle">TRANSFORMERS</text>
    <rect x="284" y="196" width="56" height="17" rx="3.5" fill="#1b2414" stroke="#485c25"/><text class="chip" x="312" y="208" text-anchor="middle">OFFLINE</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#6b675f" text-anchor="end">github.com/Aayushbankar/privata</text>
</g>

<!-- RAG Vector Search Vector Diagram -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#101010" stroke="#2a2a26"/>
  <!-- Local Docs -->
  <rect x="-48" y="-46" width="96" height="16" rx="3" fill="#1b2414" stroke="#9da65d" stroke-width="1.2"/>
  <text x="0" y="-34" font-size="8" fill="#9da65d" font-weight="700" text-anchor="middle">Sensitive Docs</text>
  <!-- Embeddings -->
  <rect x="-42" y="-12" width="84" height="22" rx="4" fill="#161e12" stroke="#485c25" stroke-width="1.2"/>
  <text x="0" y="2" font-size="8" fill="#ede8dc" font-weight="700" text-anchor="middle">384-Dim Vectors</text>
  <!-- ChromaDB Store -->
  <rect x="-48" y="28" width="96" height="16" rx="3" fill="#101010" stroke="#9da65d" stroke-width="1.2"/>
  <text x="0" y="39" font-size="7.5" fill="#ede8dc" font-weight="700" text-anchor="middle">ChromaDB Store</text>
  <!-- Connectors -->
  <line x1="0" y1="-30" x2="0" y2="-12" stroke="#9da65d" stroke-width="1.2"/>
  <line x1="0" y1="10" x2="0" y2="28" stroke="#485c25" stroke-width="1.2"/>
</g>
</svg>
