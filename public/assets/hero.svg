<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Aayush Bankar — Systems Security Researcher &amp; AI-Augmented Engineer">
<title>Aayush Bankar :: Systems Security Operations</title>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020611"/>
    <stop offset="50%" stop-color="#050e1f"/>
    <stop offset="100%" stop-color="#01040a"/>
  </linearGradient>

  <radialGradient id="core" cx="50%" cy="46%" r="62%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16"/>
    <stop offset="45%" stop-color="#0284c7" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="22%" stop-color="#fff" stop-opacity="0.75"/>
    <stop offset="72%" stop-color="#fff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="rainMask"><rect width="1200" height="360" fill="url(#fadeY)"/></mask>

  <pattern id="crt" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#7dd3fc" opacity="0.025"/>
  </pattern>

  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tight" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Disassembly Opcode Rain Columns -->
  <g id="colA" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#0284c7">
    <text y="0" opacity=".14">48</text><text y="20" opacity=".18">89</text>
    <text y="40" opacity=".22">E5</text><text y="60" opacity=".26">0F</text>
    <text y="80" opacity=".32">05</text><text y="100" opacity=".38">41</text>
    <text y="120" opacity=".45">54</text><text y="140" opacity=".54">FF</text>
    <text y="160" opacity=".64">D0</text><text y="180" opacity=".74">C3</text>
    <text y="200" opacity=".86" fill="#38bdf8">90</text><text y="220" opacity="1" fill="#e0f2fe">7F</text>
  </g>
  <g id="colB" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#0284c7">
    <text y="0" opacity=".14">E8</text><text y="20" opacity=".18">24</text>
    <text y="40" opacity=".22">31</text><text y="60" opacity=".26">C0</text>
    <text y="80" opacity=".32">5D</text><text y="100" opacity=".38">C3</text>
    <text y="120" opacity=".45">48</text><text y="140" opacity=".54">8B</text>
    <text y="160" opacity=".64">05</text><text y="180" opacity=".74">89</text>
    <text y="200" opacity=".86" fill="#38bdf8">C7</text><text y="220" opacity="1" fill="#e0f2fe">EB</text>
  </g>
  <g id="colC" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#0284c7">
    <text y="0" opacity=".14">66</text><text y="20" opacity=".18">0F</text>
    <text y="40" opacity=".22">EF</text><text y="60" opacity=".26">C0</text>
    <text y="80" opacity=".32">48</text><text y="100" opacity=".38">83</text>
    <text y="120" opacity=".45">EC</text><text y="140" opacity=".54">28</text>
    <text y="160" opacity=".64">4C</text><text y="180" opacity=".74">89</text>
    <text y="200" opacity=".86" fill="#38bdf8">F1</text><text y="220" opacity="1" fill="#e0f2fe">00</text>
  </g>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    @keyframes glitchA {
      0%, 88%, 100% { opacity: 0; transform: translate(0, 0); }
      89% { opacity: 0.8; transform: translate(-3px, 1.5px); }
      91% { opacity: 0.8; transform: translate(3px, -1.5px); }
      93% { opacity: 0; }
    }
    @keyframes glitchB {
      0%, 86%, 100% { opacity: 0; transform: translate(0, 0); }
      87% { opacity: 0.7; transform: translate(2.5px, -1px); }
      90% { opacity: 0.7; transform: translate(-2.5px, 1px); }
      92% { opacity: 0; }
    }
    .gA { animation: glitchA 7s infinite ease-in-out; }
    .gB { animation: glitchB 7s infinite ease-in-out; }
  </style>
</defs>

<!-- Deep Sky Backdrop -->
<rect width="1200" height="360" fill="url(#sky)"/>
<rect width="1200" height="360" fill="url(#core)"/>

<!-- Opcode Rain -->
<g mask="url(#rainMask)">
  <use href="#colA" x="42"   y="-180"><animateTransform attributeName="transform" type="translate" values="0,0;0,720" dur="9.2s"  repeatCount="indefinite"/></use>
  <use href="#colB" x="112"  y="-420"><animateTransform attributeName="transform" type="translate" values="0,0;0,800" dur="13s"   repeatCount="indefinite"/></use>
  <use href="#colC" x="182"  y="-300"><animateTransform attributeName="transform" type="translate" values="0,0;0,680" dur="7.5s"  repeatCount="indefinite"/></use>
  <use href="#colA" x="252"  y="-540"><animateTransform attributeName="transform" type="translate" values="0,0;0,920" dur="15s"   repeatCount="indefinite"/></use>
  <use href="#colB" x="322"  y="-260"><animateTransform attributeName="transform" type="translate" values="0,0;0,640" dur="10.5s" repeatCount="indefinite"/></use>
  <use href="#colC" x="392"  y="-460"><animateTransform attributeName="transform" type="translate" values="0,0;0,840" dur="8.2s"  repeatCount="indefinite"/></use>
  <use href="#colA" x="462"  y="-350"><animateTransform attributeName="transform" type="translate" values="0,0;0,730" dur="12s"   repeatCount="indefinite"/></use>
  <use href="#colB" x="742"  y="-280"><animateTransform attributeName="transform" type="translate" values="0,0;0,660" dur="9.6s"  repeatCount="indefinite"/></use>
  <use href="#colC" x="812"  y="-500"><animateTransform attributeName="transform" type="translate" values="0,0;0,880" dur="14s"   repeatCount="indefinite"/></use>
  <use href="#colA" x="882"  y="-320"><animateTransform attributeName="transform" type="translate" values="0,0;0,700" dur="7.8s"  repeatCount="indefinite"/></use>
  <use href="#colB" x="952"  y="-600"><animateTransform attributeName="transform" type="translate" values="0,0;0,980" dur="16s"   repeatCount="indefinite"/></use>
  <use href="#colC" x="1022" y="-240"><animateTransform attributeName="transform" type="translate" values="0,0;0,620" dur="11s"   repeatCount="indefinite"/></use>
  <use href="#colA" x="1092" y="-430"><animateTransform attributeName="transform" type="translate" values="0,0;0,810" dur="8.8s"  repeatCount="indefinite"/></use>
  <use href="#colB" x="1152" y="-360"><animateTransform attributeName="transform" type="translate" values="0,0;0,740" dur="12.6s" repeatCount="indefinite"/></use>
</g>

<!-- Perspective Floor Grid -->
<g stroke="#0369a1" fill="none">
  <g opacity="0.30">
    <path d="M600 252 L-140 360"/><path d="M600 252 L40 360"/><path d="M600 252 L200 360"/>
    <path d="M600 252 L340 360"/><path d="M600 252 L470 360"/><path d="M600 252 L600 360"/>
    <path d="M600 252 L730 360"/><path d="M600 252 L860 360"/><path d="M600 252 L1000 360"/>
    <path d="M600 252 L1160 360"/><path d="M600 252 L1340 360"/>
  </g>
  <g opacity="0.34" stroke-width="1">
    <path d="M0 268 H1200"/><path d="M0 280 H1200"/><path d="M0 296 H1200"/>
    <path d="M0 316 H1200"/><path d="M0 340 H1200"/>
  </g>
</g>
<rect x="0" y="252" width="1200" height="108" fill="#01040a" opacity="0.45"/>

<!-- Top HUD Rail -->
<g class="mono">
  <path d="M0 34 H1200" stroke="#0c2d48" stroke-width="1"/>
  <g fill="#0284c7">
    <rect x="24" y="26" width="1" height="8"/><rect x="44" y="28" width="1" height="6"/>
    <rect x="64" y="26" width="1" height="8"/><rect x="84" y="28" width="1" height="6"/>
    <rect x="104" y="26" width="1" height="8"/>
    <rect x="1096" y="26" width="1" height="8"/><rect x="1116" y="28" width="1" height="6"/>
    <rect x="1136" y="26" width="1" height="8"/><rect x="1156" y="28" width="1" height="6"/>
    <rect x="1176" y="26" width="1" height="8"/>
  </g>
  <text x="140" y="24" font-size="11.5" letter-spacing="2.6" fill="#38bdf8">KERNEL HARNESS</text>
  <text x="286" y="24" font-size="11.5" letter-spacing="2.6" fill="#0284c7">//</text>
  <text x="310" y="24" font-size="11.5" letter-spacing="2.6" fill="#38bdf8">DEBUGGER TTY0</text>
  <text x="1076" y="24" font-size="11.5" letter-spacing="2.6" fill="#38bdf8" text-anchor="end">NODE: AAYUSH-RESEARCH</text>
</g>

<!-- Target-Lock Brackets -->
<g stroke="#00e5ff" fill="none" stroke-width="2" opacity="0.75">
  <g><path d="M214 112 L214 92 L262 92"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-7,-4;0,0" dur="5s" repeatCount="indefinite"/></g>
  <g><path d="M986 112 L986 92 L938 92"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;7,-4;0,0" dur="5s" repeatCount="indefinite"/></g>
  <g><path d="M214 196 L214 216 L262 216"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-7,4;0,0" dur="5s" repeatCount="indefinite"/></g>
  <g><path d="M986 196 L986 216 L938 216"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;7,4;0,0" dur="5s" repeatCount="indefinite"/></g>
</g>

<!-- Name Typography + Subtle Glitch -->
<g class="mono" text-anchor="middle" font-size="74" font-weight="800" letter-spacing="9">
  <text class="gA" x="600" y="172" fill="#ec4899" opacity="0" style="mix-blend-mode:screen">AAYUSH BANKAR</text>
  <text class="gB" x="600" y="172" fill="#38bdf8" opacity="0" style="mix-blend-mode:screen">AAYUSH BANKAR</text>
  <text x="600" y="172" fill="#f0f9ff" filter="url(#soft)">AAYUSH BANKAR</text>
</g>

<!-- Rotating Role Subtitles -->
<g class="mono" text-anchor="middle" font-size="14.5" letter-spacing="4.4" fill="#00e5ff">
  <text x="600" y="205" opacity="0">SYSTEMS SECURITY RESEARCHER &#183; KERNEL EXPLOIT TRIAGE
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.22;0.245;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="600" y="205" opacity="0">LINUX KERNEL UAF &#183; ANDROID FRAMEWORK AUDIT
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.47;0.495;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="600" y="205" opacity="0">SOVEREIGN HIGH-THROUGHPUT PIPELINES &#183; SPECTRE-PRISM
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.72;0.745;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="600" y="205" opacity="0">EVIDENCE OVER ASSERTION &#183; VERIFIABLE EXECUTION
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.98;1" dur="18s" repeatCount="indefinite"/></text>
</g>

<!-- Telemetry Pulse Trace -->
<g fill="none">
  <path d="M180 240 H430 l10 -13 l9 26 l10 -22 l8 9 H620 l9 -17 l10 30 l9 -24 l8 11 H1020" stroke="#0369a1" stroke-width="1.4" opacity="0.5"/>
  <path d="M180 240 H430 l10 -13 l9 26 l10 -22 l8 9 H620 l9 -17 l10 30 l9 -24 l8 11 H1020"
        stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="70 770" opacity="0.95">
    <animate attributeName="stroke-dashoffset" values="840;0" dur="4.4s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Bottom Status Bar HUD -->
<g class="mono" font-size="12" letter-spacing="2.2">
  <circle cx="218" cy="316" r="4" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <text x="232" y="320" fill="#94a3b8">STATUS <tspan fill="#00e5ff">ACTIVE</tspan></text>
  <path d="M342 308 V326" stroke="#0c2d48"/>
  <rect x="360" y="312" width="8" height="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="376" y="320" fill="#94a3b8">GUJARAT, IN</text>
  <path d="M506 308 V326" stroke="#0c2d48"/>
  <circle cx="526" cy="316" r="4.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="538" y="320" fill="#94a3b8">UTC+05:30</text>
  <path d="M656 308 V326" stroke="#0c2d48"/>
  <path d="M676 311 l5 -4 l5 4 v6 l-5 4 l-5 -4 z" fill="none" stroke="#a855f7" stroke-width="1.4"/>
  <text x="694" y="320" fill="#94a3b8">ROLE <tspan fill="#38bdf8">@CYPHERMATRIX</tspan></text>
  <path d="M860 308 V326" stroke="#0c2d48"/>
  <text x="876" y="320" fill="#94a3b8">SIH <tspan fill="#f59e0b">SCREENING</tspan></text>
</g>

<!-- CRT Scanline + Radar Sweep -->
<rect width="1200" height="360" fill="url(#crt)"/>
<rect x="0" y="-110" width="1200" height="110" fill="url(#sweep)">
  <animate attributeName="y" values="-110;360" dur="6.5s" repeatCount="indefinite"/>
</rect>

<!-- Cyber Frame Corners -->
<g stroke="#00e5ff" fill="none" stroke-width="1.6" opacity="0.5">
  <path d="M14 46 L14 14 L52 14"/><path d="M1186 46 L1186 14 L1148 14"/>
  <path d="M14 314 L14 346 L52 346"/><path d="M1186 314 L1186 346 L1148 346"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="359" fill="none" stroke="#0c2d48" stroke-width="1"/>
</svg>
