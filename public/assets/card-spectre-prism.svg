<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="SPECTRE-PRISM Sovereign Log Processing Framework">
<title>SPECTRE-PRISM</title>
<defs>
  <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04121b"/><stop offset="1" stop-color="#02080d"/>
  </linearGradient>
  <radialGradient id="sp-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="sp-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#0e2333" stroke-width="1" fill="none"/>
  </pattern>
  <filter id="sp-g" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .d { font-size: 11px; fill: #94a3b8; }
    .chip { font-size: 9px; letter-spacing: 1.1px; fill: #7dd3fc; }
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#sp-bg)" stroke="#1e293b"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#sp-grid)" opacity="0.55"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#sp-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#00e5ff" opacity="0.85"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#06232e" stroke="#0e7490"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#00e5ff" text-anchor="middle">03</text>
  <circle cx="72" cy="29" r="3.5" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#38bdf8">SOVEREIGN ARCHITECTURE &#183; SIH 2026</text>

  <text x="24" y="72" font-size="24" font-weight="800" letter-spacing="1.4" fill="#f8fafc">SPECTRE-PRISM</text>
  <text x="24" y="93" font-size="10" letter-spacing="2" fill="#00e5ff">5-PLANE LOG PLATFORM &#183; VERIFIABLE LEDGER</text>
  <path d="M24 104 H352" stroke="#1e293b"/>

  <text class="d" x="24" y="124">5-plane sovereign log ingestion and audit framework.</text>
  <text class="d" x="24" y="141">Zero-copy SIMD ingestion hitting 13K events/s/core.</text>
  <text class="d" x="24" y="158">RFC 6962 verifiable transparency ledgers with BLAKE3.</text>
  <text class="d" x="24" y="175">Qualified internal college round, SIH screening phase.</text>

  <g>
    <rect x="24" y="196" width="94" height="17" rx="3.5" fill="#06232e" stroke="#0e7490"/><text class="chip" x="71" y="208" text-anchor="middle">5-PLANE SPEC</text>
    <rect x="124" y="196" width="68" height="17" rx="3.5" fill="#06232e" stroke="#0e7490"/><text class="chip" x="158" y="208" text-anchor="middle">RFC 6962</text>
    <rect x="198" y="196" width="60" height="17" rx="3.5" fill="#06232e" stroke="#0e7490"/><text class="chip" x="228" y="208" text-anchor="middle">BLAKE3</text>
    <rect x="264" y="196" width="52" height="17" rx="3.5" fill="#06232e" stroke="#0e7490"/><text class="chip" x="290" y="208" text-anchor="middle">OCSF</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#64748b" text-anchor="end">github.com/Aayushbankar/spectre-prism</text>
</g>

<!-- 5-Plane Merkle Pipeline Graphic -->
<g transform="translate(466,126)" class="m">
  <circle r="64" fill="#06131c" stroke="#1e293b"/>
  <!-- Plane 1: Ingest -->
  <rect x="-50" y="-46" width="100" height="18" rx="3" fill="#082333" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="-42" y="-33" font-size="8.5" fill="#00e5ff" font-weight="700">P1: Ingest (SIMD)</text>

  <path d="M0 -28 V -12" stroke="#00e5ff" stroke-width="1.5"/>

  <!-- Plane 2: Norm & Ledger -->
  <rect x="-50" y="-12" width="100" height="18" rx="3" fill="#082333" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="-42" y="1" font-size="8.5" fill="#38bdf8" font-weight="700">P2: Normalize (OCSF)</text>

  <path d="M0 6 V 22" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Plane 3: Merkle Tree Root -->
  <rect x="-50" y="22" width="100" height="20" rx="3" fill="#0c2b23" stroke="#10b981" stroke-width="1.2"/>
  <text x="-42" y="36" font-size="8.5" fill="#10b981" font-weight="700">P3: Merkle Root</text>

  <circle cx="42" cy="-38" r="3" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
